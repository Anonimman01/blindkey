# /etc/gatekeeper/config.toml: все ключи необязательны, ниже значения по умолчанию.
# Неизвестный ключ = ошибка запуска (чтобы опечатки не проходили молча).

[server]
listen_host = "127.0.0.1"   # на VPS: "0.0.0.0" или адрес интерфейса
listen_port = 8443
# metrics_socket = "/run/gatekeeper/ops.sock"  # GET /healthz и /metrics, только локально (Unix-сокет, 0600)
# persist_state = true      # nonce, бюджет, баны и аномалии в state.db переживают перезапуск
# audit_max_bytes = 67108864  # 64 МиБ: при переполнении журнал начинает новый сегмент (0 = без ротации)
# audit_keep = 10          # сколько прошлых сегментов audit.log.<ts> хранить
# max_total_response_bytes = 268435456  # 256 МиБ: общий потолок памяти под ответы upstream
# max_handshaking_per_ip = 3  # одновременных TLS-рукопожатий с одного IP (слот только на рукопожатие)

[provider]
name = "telegram"
# Токен бота берётся из переменной окружения, а если её нет, из файла (права 0400).
# В самом config.toml токена быть не должно.
secret_env = "GATEKEEPER_UPSTREAM_TOKEN"
# secret_file = "/etc/gatekeeper/upstream.token"
# Только для тестов с поддельным API:
# upstream_host = "127.0.0.1"
# upstream_port = 9999
# upstream_tls = false   # разрешено только вместе с upstream_host на loopback (127.0.0.1, ::1, localhost)

# Несколько провайдеров на одном шлюзе: вместо [provider] (нельзя вместе):
# [providers.telegram]
# secret_env = "GATEKEEPER_TELEGRAM_TOKEN"    # по умолчанию GATEKEEPER_<ИМЯ>_TOKEN
# [providers.github]
# secret_file = "/etc/gatekeeper/github.token"
# [providers.openai]       # также vercel, cloudflare; секрет по умолчанию в GATEKEEPER_<ИМЯ>_TOKEN
# secret_file = "/etc/gatekeeper/openai.key"
# Клиенты без поля provider идут к default_provider (в [server]); не задан = первый в файле,
# но при нескольких провайдерах шлюз тогда не запустится, пока такие клиенты есть.
# На провайдера: confirm_apis = ["deleteMessage"], max_response_bytes = 8388608, max_inflight = 32

[limits]
max_connections = 100       # всего одновременных соединений
max_per_ip = 10             # с одного IP
rate_per_sec = 5.0          # запросов в секунду на клиента
burst = 10
daily_budget = 10000        # запросов в сутки (UTC) на клиента
max_body_bytes = 1048576    # 1 МБ; большие загрузки (sendDocument) пока не пройдут
# max_json_body_bytes = 262144  # потолок разбора JSON-тела (подтверждаемые методы — только JSON)
# header_timeout = 10.0       # секунд на заголовки запроса
# body_timeout = 30.0         # секунд на тело запроса
decoy_ban_seconds = 3600    # бан IP, с которого использовали приманку

[anomaly]
# Автозаморозка клиента: N отказов (неверная подпись, повтор, нарушение политики)
# за T секунд. Считаются только клиенты с действующим сертификатом. 0 = выключено.
autofreeze_threshold = 0
autofreeze_window = 60

[confirm]
# Опасные методы API: выполняются только после `gatekeeper approve --id ...` на машине шлюза.
# Подтверждение одноразовое и привязано к клиенту, методу и телу запроса. Пусто = выключено.
# Тело подтверждаемого метода обязано быть строгим JSON (без дублей ключей, NaN, Infinity):
# только так оператор видит в `gatekeeper pending` ровно те параметры, которые уйдут upstream.
# apis = ["deleteMessage", "banChatMember"]
ttl = 300   # секунд на подтверждение и на жизнь заявки
