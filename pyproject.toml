[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blindkey"
version = "0.3.9a1"
requires-python = ">=3.11"
description = "Self-hosted mTLS gateway that keeps API tokens (Telegram, GitHub, OpenAI, Vercel, Cloudflare) off bots, scripts and AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Anonimman01"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Logging",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = ["mtls", "api-gateway", "api-key", "secrets", "secret-management", "credential-proxy",
    "telegram", "telegram-bot", "github", "openai", "ai-agents", "vercel", "cloudflare",
    "hmac", "audit-log", "honeytoken", "zero-trust", "security", "gateway", "proxy"]
dependencies = ["cryptography>=42", "h11>=0.16"]

[project.urls]
Homepage = "https://github.com/Anonimman01/blindkey"
Repository = "https://github.com/Anonimman01/blindkey"
Issues = "https://github.com/Anonimman01/blindkey/issues"
Documentation = "https://github.com/Anonimman01/blindkey#readme"
Security = "https://github.com/Anonimman01/blindkey/security/policy"
Changelog = "https://github.com/Anonimman01/blindkey/blob/main/CHANGELOG.md"

[project.scripts]
gatekeeper = "gatekeeper.cli.main:main"
blindkey = "gatekeeper.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gatekeeper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["gatekeeper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = [
    "E501",   # длину строк держит ревью, а не линтер
    "RUF001", # кириллица в строках и комментариях: норма этого проекта
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
