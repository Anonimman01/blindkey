name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      # B-07/B-13: lock не должен расходиться с .in, а все пакеты обязаны иметь хеши.
      - name: Lockfiles match their .in files and are fully hashed
        run: >-
          python scripts/check_lock.py
          requirements.in requirements.lock
          requirements-dev.in requirements-dev.lock

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      # --no-deps: pip-compile не кладёт в lock pip и setuptools, поэтому с --require-hashes
      # pip упал бы на зависимостях pip-api/pip-tools. Lock полный, транзитивные пакеты в нём есть.
      # dev-lock не включает runtime-зависимости, поэтому ставим оба файла.
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps -e .
      # Включая scripts/: demo_github.py тоже должен проходить линтер (B-18).
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Windows гоняем на крайних версиях: остальное покрывает ubuntu
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      # --no-deps: pip-compile не кладёт в lock pip и setuptools, поэтому с --require-hashes
      # pip упал бы на зависимостях pip-api/pip-tools. Lock полный, транзитивные пакеты в нём есть.
      # dev-lock не включает runtime-зависимости, поэтому ставим оба файла.
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Tests
        run: python -m pytest -q --cov --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python -m pip_audit --strict --require-hashes -r requirements.lock
